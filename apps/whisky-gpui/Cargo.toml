[package]
name = "whisky-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.8.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
smol = "=2.0.2"
whisky-bridge = { path = "../../crates/whisky-bridge" }

[features]
visual-test = ["gpui-kit/test-support"]

[profile.dev]
debug = 0

[profile.release]
lto = "thin"

