name: CI

on:
  # Docs-only changes can't affect the Swift build or tests, so skip the whole
  # workflow. Actions minutes are free on public repos, but macOS runner
  # concurrency is limited — skipped jobs are queue time given back to real runs.
  # paths-ignore skips a run only when *every* changed file matches, so a PR that
  # also touches code still runs the full suite.
  #
  # Required status checks should account for docs-only workflow skips.
  push:
    branches: [main]
    paths-ignore: &docs-paths
      - '**.md'
      - 'docs/**'
      - 'images/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore: *docs-paths
  workflow_dispatch:

permissions:
  contents: read

# Shared environment variables for consistency across jobs
env:
  # macos-26 runners: their latest-stable Xcode is 27, which is what this
  # codebase is developed and released against. The Xcode 26.3 toolchain on
  # macos-15 has an allocator failure inside Steam library discovery tests.
  XCODE_VERSION: 'latest-stable'

# Prevent duplicate runs on the same PR
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Lint job runs first on cheaper ubuntu runner
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --strict

  # Format check job runs in parallel with lint
  format:
    name: SwiftFormat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install SwiftFormat
        run: |
          # Install SwiftFormat via pre-built binary
          wget -q https://github.com/nicklockwood/SwiftFormat/releases/download/0.58.7/swiftformat_linux.zip
          unzip -q swiftformat_linux.zip
          chmod +x swiftformat_linux
          sudo mv swiftformat_linux /usr/local/bin/swiftformat
      - name: Check Formatting
        run: |
          swiftformat --lint . || {
            echo ""
            echo "❌ Code formatting issues found!"
            echo "Run 'swiftformat .' locally to fix formatting."
            exit 1
          }

  # A partial en-GB is worse than none: macOS picks one localization per process
  # and renders the raw key for anything missing from it, so a single string
  # added without regenerating shows `config.audio.driver.auto` to every British
  # user rather than falling back to en.
  localization:
    name: Localization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check en-GB covers every string
        run: |
          ./scripts/british-english.py --check || {
            echo ""
            echo "Run ./scripts/british-english.py locally and commit the result."
            exit 1
          }
      - name: Verify third-party notices and source inventory
        run: python3 scripts/check-third-party.py

  # Test job for WhiskyKit - always runs to ensure coverage is uploaded
  test:
    name: Run Tests
    needs: [lint, format]
    runs-on: macos-26
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      
      # Cache includes WhiskyKit/.build because swift build/test creates
      # build artifacts there (unlike xcodebuild which uses DerivedData)
      - name: Cache SPM Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            .build
            WhiskyKit/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      
      - name: Show Swift version
        run: swift --version
      
      - name: Build WhiskyKit
        run: swift build --package-path WhiskyKit
      
      - name: Run Tests with Code Coverage
        run: swift test --package-path WhiskyKit --enable-code-coverage
          
      - name: Generate Coverage Report
        id: coverage
        run: |
          cd WhiskyKit

          # Debug: Show build directory structure
          echo "=== Build directory structure ==="
          find .build -type d -name "debug" 2>/dev/null | head -5

          echo "=== Looking for xctest bundles ==="
          find .build -name "*.xctest" -type d 2>/dev/null

          echo "=== Looking for profdata files ==="
          find .build -name "*.profdata" 2>/dev/null

          # Find the test binary - search entire .build directory for architecture-specific paths
          TEST_BINARY=""

          # Check for SPM test binary in xctest bundle (searches all architectures)
          XCTEST_BUNDLE=$(find .build -path "*debug*" -name "WhiskyKitPackageTests.xctest" -type d 2>/dev/null | head -1)
          if [ -n "$XCTEST_BUNDLE" ]; then
            BUNDLE_NAME=$(basename "$XCTEST_BUNDLE" .xctest)
            TEST_BINARY="$XCTEST_BUNDLE/Contents/MacOS/$BUNDLE_NAME"
            echo "=== Found xctest bundle: $XCTEST_BUNDLE ==="
            echo "=== Test binary path: $TEST_BINARY ==="
          fi

          # Verify the binary exists
          if [ ! -f "$TEST_BINARY" ]; then
            echo "=== Binary not in bundle, searching for standalone executable ==="
            TEST_BINARY=$(find .build -path "*debug*" -type f -name "WhiskyKitPackageTests" -perm +111 2>/dev/null | head -1)
            echo "=== Found: $TEST_BINARY ==="
          fi

          if [ -f "$TEST_BINARY" ]; then
            echo "=== Using test binary: $TEST_BINARY ==="

            PROFDATA=$(find .build -name "default.profdata" 2>/dev/null | head -1)
            if [ -n "$PROFDATA" ]; then
              echo "=== Using profdata: $PROFDATA ==="

              # Get the absolute path to WhiskyKit for path mapping
              WHISKYKIT_PATH="$(pwd)"
              echo "=== WhiskyKit path: $WHISKYKIT_PATH ==="

              # Generate coverage, filtering out build artifacts and dependencies
              xcrun llvm-cov export \
                "$TEST_BINARY" \
                -instr-profile="$PROFDATA" \
                -format=lcov \
                --ignore-filename-regex='\.build/' > coverage.raw.lcov

              # Convert absolute paths to relative paths for Codecov
              # Maps /Users/runner/work/Whisky/Whisky/WhiskyKit/Sources/... -> WhiskyKit/Sources/...
              sed "s|${WHISKYKIT_PATH}/|WhiskyKit/|g" coverage.raw.lcov > coverage.lcov
              rm coverage.raw.lcov

              # Verify the coverage file was created and has content
              if [ -s coverage.lcov ]; then
                echo "✅ Coverage report generated successfully"
                echo "=== Coverage file size: $(wc -c < coverage.lcov) bytes ==="
                echo "=== First 30 lines of coverage.lcov ==="
                head -30 coverage.lcov
                echo "=== Unique source file paths ==="
                grep "^SF:" coverage.lcov | head -10
                echo "has_coverage=true" >> $GITHUB_OUTPUT
              else
                echo "❌ Coverage file is empty"
              fi
            else
              echo "❌ Warning: No profdata file found"
            fi
          else
            echo "❌ Warning: Could not find test binary"
            echo "=== Listing all executables in .build ==="
            find .build -path "*debug*" -type f -perm +111 2>/dev/null | grep -i test | head -20
          fi
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: WhiskyKit/coverage.lcov
          flags: whiskykit
          fail_ci_if_error: false
          verbose: true
      
      - name: Upload Coverage Report (Artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: WhiskyKit/coverage.lcov
          if-no-files-found: ignore

  gpui:
    name: GPUI (macOS)
    needs: [lint, format]
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/whisky-gpui/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/whisky-gpui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run WhiskyBridge tests
        run: swift test --package-path WhiskyBridge
      - name: Run GPUI tests
        run: cargo test --locked --manifest-path apps/whisky-gpui/Cargo.toml
      - name: Verify GPUI app packaging
        run: |
          ./build.sh run whisky-macos-gpui-arm64 --output build/ci-gpui
          app=build/ci-gpui/artifacts/Whisky.app
          test -x "$app/Contents/MacOS/whisky-gpui"
          for res in whisky-bridge winetricks verbs.txt cabextract WhiskyKit_WhiskyKit.bundle WhiskyCore_WhiskyCore.bundle; do
            test -e "$app/Contents/Resources/$res" || { echo "Missing resource: $res"; exit 1; }
          done
          python3 scripts/check-third-party.py --resources "$app/Contents/Resources"
          codesign --verify --deep --strict "$app"
