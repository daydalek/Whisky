name: Build and release Whisky app

on:
  push:
    tags: ['v*', 'app-v*', 'vn-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'App version X.Y.Z; manual runs upload Actions artifacts'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26 # latest-stable Xcode 27, matching CI and local release builds
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/whisky-gpui/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/whisky-gpui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run WhiskyBridge tests
        run: swift test --package-path WhiskyBridge
      - name: Run GPUI tests
        run: cargo test --release --locked --manifest-path apps/whisky-gpui/Cargo.toml
      - name: Build, sign and package GPUI app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="$MANUAL_VERSION"
          else
            version="${RELEASE_TAG#vn-}"
            version="${version#app-}"
            version="${version#v}"
          fi
          ./build.sh run whisky-macos-gpui-arm64 \
            --version "$version" \
            --build-number "$BUILD_NUMBER" \
            --output build/app-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: whisky-app-release
          path: build/app-release/packages/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: whisky-app-release
          path: release
      - name: Publish installable app to this fork
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber \
              ./*.zip ./*-sources.tar.gz SHA256SUMS build-info.json RELEASE-NOTES.md
            gh release edit "$RELEASE_TAG" --prerelease \
              --title "Whisky $RELEASE_TAG — Apple Silicon" --notes-file RELEASE-NOTES.md
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
            --title "Whisky $RELEASE_TAG — Apple Silicon" \
            --notes-file RELEASE-NOTES.md ./*.zip ./*-sources.tar.gz SHA256SUMS build-info.json RELEASE-NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
