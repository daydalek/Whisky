name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # This fork distributes ad-hoc signed app ZIPs through AppRelease.yml.
      # UpdateHomebrewTap.yml is scoped to the upstream frankea/Whisky repository.
      # See docs/ReleaseWorkflow.md for the current app and Wine release paths.

      - name: Release Info
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          echo "Release $TAG_NAME published"
          echo "Distribution: GitHub Releases"
          echo "Download: https://github.com/$RELEASE_REPOSITORY/releases"
