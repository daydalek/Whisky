# Codecov Configuration for Maltoria
# https://docs.codecov.io/docs/codecovyml-reference

# Coverage settings
coverage:
  # Overall project coverage thresholds
  status:
    project:
      default:
        # Target coverage percentage (start low, increase over time)
        target: 50%
        # Allow coverage to drop by this much without failing
        threshold: 5%
        # Set coverage status to error if CI build fails
        if_ci_failed: error
        # Only post coverage status on pull requests, not on commits to default branch
        only_pulls: true
        # Gate on WhiskyKit unit-test coverage
        flags:
          - whiskykit
      gpui:
        target: auto
        threshold: 0%
        if_ci_failed: error
        flags: [gpui]
      bridge-sdk:
        target: auto
        threshold: 0%
        if_ci_failed: error
        flags: [bridge-sdk]
      bridge-application:
        target: auto
        threshold: 0%
        if_ci_failed: error
        flags: [bridge-application]
    # Per-patch (diff) coverage requirements
    patch:
      default:
        # Require new code to have at least 60% coverage
        target: 60%
        threshold: 10%
        flags:
          - whiskykit
      gpui:
        target: 85%
        threshold: 0%
        if_ci_failed: error
        flags: [gpui]
      bridge-sdk:
        target: 85%
        threshold: 0%
        if_ci_failed: error
        flags: [bridge-sdk]
      bridge-application:
        target: 85%
        threshold: 0%
        if_ci_failed: error
        flags: [bridge-application]

  # Precision of coverage percentage (2 decimal places)
  precision: 2
  round: down
  range: "40...100"

# Comment configuration for pull requests
comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

# Flag management
flags:
  whiskykit:
    paths:
      - WhiskyKit/Sources/**
    carryforward: true
  gpui:
    paths: [apps/whisky-gpui/src/**]
    carryforward: false
  bridge-sdk:
    paths: [crates/whisky-bridge/src/**]
    carryforward: false
  bridge-application:
    paths:
      - WhiskyBridge/Sources/WhiskyApplication/**
      - WhiskyBridge/Sources/WhiskyBridgeProtocol/**
      - WhiskyBridge/Sources/WhiskyNativeBridge/**
    carryforward: false

# Ignore paths from coverage calculation
ignore:
  - "WhiskyKit/Tests/**"
  - "**/*.generated.swift"
  - "apps/whisky-gpui/tests/**"
  - "apps/whisky-gpui/src/headless_state_machine_tests.rs"
  - "apps/whisky-gpui/src/upscale/tests.rs"
  - "crates/whisky-bridge/tests/**"
  - "WhiskyBridge/Tests/**"

# Path fixes for CI environment
# Not needed - coverage report already contains correct relative paths

# Component definitions for better reporting
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 5%
  individual_components:
    - component_id: whiskykit
      name: WhiskyKit
      paths:
        - WhiskyKit/Sources/**
